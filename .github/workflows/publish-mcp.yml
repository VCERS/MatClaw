name: Publish MCP image

# Builds mcp/Dockerfile and pushes it to GitHub Container Registry.
#
# One-time setup after the first successful run: the package is created
# PRIVATE even on a public repo. Open Packages -> matclaw-mcp -> Package
# settings, set visibility to Public, and link it to this repository under
# "Manage Actions access" with write permission. Until visibility is public,
# pulling on the DGX fails with a misleading "denied"/"manifest unknown".

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mcp/**'
      - '.github/workflows/publish-mcp.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/matclaw-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets the built-in GITHUB_TOKEN push to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The torch CUDA wheel is ~2.5 GB; caching keeps rebuilds tolerable.
          cache-from: type=gha
          cache-to: type=gha,mode=max
